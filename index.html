  .stage {

<body><div class="app" id="appRoot">
<header class="header"><div class="brand">LA CASA<br>HAMBRIENTA<small>DUSKMOURN · COMMANDER</small></div><div class="roster" id="roster" aria-label="Participantes"></div><div class="header-tools"><button class="round-button" id="globalHelp" type="button" aria-label="Reglas">i</button><button class="round-button" id="globalHistory" type="button" aria-label="Historial">◷</button><button class="round-button" id="toggleSound" type="button" aria-label="Silenciar sonidos" aria-pressed="true">♫</button></div></header>
<main>
<section id="setupScreen" class="setup"><h2>ENTRAR EN LA CASA</h2><p class="sub">Elige los visitantes y sus retratos.</p><div class="count-row"><b>Jugadores</b><div class="counter"><button id="minusPlayers" aria-label="Menos jugadores">−</button><output id="playerCount">4</output><button id="plusPlayers" aria-label="Más jugadores">+</button></div></div><div class="players" id="playerConfigs"></div><p class="error" id="setupError" role="alert"></p><button class="primary" id="startButton" type="button">ENTRAR EN LA MANSIÓN</button></section>
<section id="gameScreen" class="hidden"><div class="stage" id="stage">
<div class="active-portrait" id="activePortrait" aria-live="polite"><img id="activeAvatar" src="valgavoth.png" alt="Avatar del jugador activo"><div class="portrait-meta"><span>ESTÁ JUGANDO</span><strong id="activeName">Jugador 1</strong><small id="activeRound">Ronda 1</small></div></div>
<div class="turn-line" id="turnInfo"></div>
<div class="object-gallery" aria-label="Objetos de la mansión">
<button type="button" class="object-choice selected" data-scene="chalice" aria-label="Seleccionar cáliz" aria-pressed="true"><img src="chalice-scene.webp" alt="El cáliz en la mansión"></button>
<button type="button" class="object-choice" data-scene="pentagram" aria-label="Seleccionar pentagrama" aria-pressed="false"><img src="pentagram-scene.webp" alt="El pentagrama en el suelo"></button>
<button type="button" class="object-choice" data-scene="altar" aria-label="Seleccionar altar" aria-pressed="false"><img src="altar-scene.webp" alt="El altar de ofrendas"></button>
</div>
<div class="ritual-tabs" id="ritualTabs" role="group" aria-label="Elige un ritual">
<button type="button" class="ritual-tab selected" data-tab="chalice" aria-pressed="true">🏺 CÁLIZ</button>
<button type="button" class="ritual-tab" data-tab="pentagram" aria-pressed="false">⛤ PENTAGRAMA</button>
<button type="button" class="ritual-tab" data-tab="altar" aria-pressed="false">🕯 ALTAR</button>
</div>

let audioCtx=null;
function playCurse(){if(!state.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx??=new AC();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime;[72,58,45].forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+i*.1);o.frequency.exponentialRampToValueAtTime(Math.max(22,f*.6),t+i*.1+.26);g.gain.setValueAtTime(.0001,t+i*.1);g.gain.exponentialRampToValueAtTime(.105,t+i*.1+.025);g.gain.exponentialRampToValueAtTime(.0001,t+i*.1+.3);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.1);o.stop(t+i*.1+.32)});}catch(e){}}
function curseFeedback(){const root=$('appRoot');root.classList.remove('curse-shake');void root.offsetWidth;root.classList.add('curse-shake');document.body.classList.remove('curse-flash');void document.body.offsetWidth;document.body.classList.add('curse-flash');setTimeout(()=>{root.classList.remove('curse-shake');document.body.classList.remove('curse-flash')},720);playCurse();if(navigator.vibrate)navigator.vibrate([90,40,140]);}
function tier(type,value){if(type==='chalice')return value<=2?'low':value<=4?'mid':'high';if(type==='pentagram')return value<=2?'low':value<=5?'mid':'high';return value<=1?'low':value<=3?'mid':'high'}
function drawEffect(type,value){const pool=EFFECTS[type][tier(type,value)],total=pool.reduce((n,e)=>n+e.weight,0);const a=new Uint32Array(1);crypto.getRandomValues(a);let r=a[0]/4294967296*total;for(const e of pool){r-=e.weight;if(r<0)return e}return pool.at(-1)}
function modal(html){$('modalContent').innerHTML=html;$('modalOverlay').classList.remove('hidden');$('modalContent').querySelector('button')?.focus()}
function closeModal(){if(state.revealing)return;$('modalOverlay').classList.add('hidden');state.pending=null}

function updateGame(){const p=state.players[state.turn];$('activeAvatar').src=AVATARS[p.avatar].file;$('activeAvatar').alt=`Avatar de ${p.name}: ${AVATARS[p.avatar].name}`;$('activeName').textContent=p.name;$('activeRound').textContent=`Ronda ${state.round}`;$('turnInfo').innerHTML=state.used?'🔒 PACTO REALIZADO':'ELIGE TU RITUAL';$('turnStatus').textContent=state.used?'Ya has hecho tu ofrenda.':'Solo una ofrenda por turno.';document.querySelectorAll('.ritual-do').forEach(b=>b.disabled=state.used);$('nextTurnButton').textContent=state.turn===state.players.length-1?'SIGUIENTE RONDA →':'SIGUIENTE JUGADOR →';$('roster').innerHTML=state.players.map((x,i)=>`<button type="button" class="avatar-chip ${i===state.turn?'current':''}" title="${safe(x.name)} · ${safe(AVATARS[x.avatar].name)}" aria-label="${safe(x.name)}${i===state.turn?', jugador activo':''}" data-player="${i}"><img src="${AVATARS[x.avatar].file}" alt=""><span>${safe(x.name)}</span></button>`).join('');$('roster').querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>showPlayer(+b.dataset.player));for(const type of ['chalice','pentagram','altar']){const threshold=BONUSES[type].threshold,total=p.totals[type],current=total%threshold;$(type+'Uses').textContent=`${total} acumulado · ${current}/${threshold}`;$(type+'Bar').style.width=`${100*current/threshold}%`}}
function showPlayer(i){const p=state.players[i];modal(`<div class="tag">Visitante</div><h2 id="modalTitle">${safe(p.name)}</h2><img src="${AVATARS[p.avatar].file}" style="height:95px;width:95px;object-fit:cover;border:1px solid #b4a9a0" alt=""><p>${safe(AVATARS[p.avatar].name)}</p>${Object.keys(BONUSES).map(t=>`<div class="dialog-help"><b>${LABELS[t]}:</b> ${p.totals[t]} puntos acumulados</div>`).join('')}<div class="modal-actions"><button class="primary" id="closePlayer">Cerrar</button></div>`);buttonToClose('closePlayer')}
function startGame(){const a=state.configs.slice(0,state.count).map(c=>({...c,name:c.name.trim(),totals:{chalice:0,pentagram:0,altar:0}}));if(a.some(x=>!x.name)||new Set(a.map(x=>x.name.toLowerCase())).size!==a.length){$('setupError').textContent='Escribe nombres diferentes para cada jugador.';return}if(new Set(a.map(x=>x.avatar)).size!==a.length){$('setupError').textContent='Los avatares deben ser diferentes.';return}state.players=a;state.turn=0;state.round=1;state.used=false;state.history=[];$('setupScreen').classList.add('hidden');$('gameScreen').classList.remove('hidden');updateGame()}

function showHistory(){modal(`<div class="tag">Registro</div><h2 id="modalTitle">PACTOS REALIZADOS</h2><div class="history-list">${state.history.length?state.history.slice(0,60).map(h=>`<div class="history-item"><b>${safe(h.player)}</b> · Ronda ${h.round} · ${LABELS[h.type]} (${safe(h.value)})<br><span class="${KIND_STYLES[h.effect.kind]}">${KIND_LABELS[h.effect.kind]}</span>: ${safe(h.effect.description)}${h.bonusCount?`<br><b>Bonus: ${h.bonusCount} × ${safe(BONUSES[h.type].description)}</b>`:''}</div>`).join(''):'Aún no se ha realizado ningún pacto.'}</div><div class="modal-actions"><button class="primary" id="closeHistory">Cerrar</button></div>`);buttonToClose('closeHistory')}
function ritualValue(type){return type==='chalice'?state.mana:type==='pentagram'?Math.max(0,state.power+state.toughness):state.cost}
function ritualCost(type){return type==='chalice'?`${state.mana} manás`:type==='pentagram'?`una criatura ${state.power}/${state.toughness}`:`un artefacto de valor ${state.cost}`}
function proposeRitual(type){if(state.used||state.revealing||state.pending)return;if(state.sound){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){audioCtx??=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}}catch(e){}}state.pending=type;modal(`<div class="tag">Ofrenda a Valgavoth</div><h2 id="modalTitle">${LABELS[type]}</h2><p>¿Has pagado <b>${ritualCost(type)}</b> en tu partida?</p><div class="modal-actions"><button class="outline" id="cancelRitual">Cancelar</button><button class="primary" id="confirmRitual">CONFIRMAR OFRENDA</button></div>`);$('cancelRitual').onclick=closeModal;$('confirmRitual').onclick=()=>revealRitual(type)}
function revealRitual(type){if(state.used||!state.pending)return;const value=ritualValue(type),effect=drawEffect(type,value),player=state.players[state.turn],prev=player.totals[type],after=prev+value,bonus=BONUSES[type],bonusCount=Math.floor(after/bonus.threshold)-Math.floor(prev/bonus.threshold);player.totals[type]=after;state.history.unshift({player:player.name,round:state.round,type,value,effect,bonusCount});state.used=true;state.pending=null;state.revealing=true;updateGame();modal(`<div class="thinking">◉</div><h2 id="modalTitle">LA CASA DECIDE<span class="dots"></span></h2><p>La ofrenda ha sido aceptada.</p>`);state.timer=setTimeout(()=>{state.revealing=false;if(effect.kind==='curse')curseFeedback();modal(`<div class="result-emoji">${effect.icon}</div><div class="tag ${KIND_STYLES[effect.kind]}">${KIND_LABELS[effect.kind]}</div><h2 id="modalTitle">${safe(effect.title)}</h2><p class="flavor">«${safe(effect.flavor)}»</p><p>${safe(effect.description)}</p>${bonusCount?`<div class="bonus"><strong>${bonus.icon} ${safe(bonus.title)}${bonusCount>1?` ×${bonusCount}`:''}</strong><p>${safe(bonus.description)}</p></div>`:''}<p class="sound-status">Puntos acumulados: ${after}</p><div class="modal-actions"><button class="primary" id="closeResult">ACEPTAR</button></div>`);buttonToClose('closeResult')},1550)}
function adjust(k,delta){const low=(k==='mana'?1:0),high=30;state[k]=Math.max(low,Math.min(high,state[k]+delta));const id={mana:'manaValue',power:'powerValue',toughness:'toughnessValue',cost:'artifactValue'}[k];$(id).textContent=state[k]}
function selectRitualTab(type){document.querySelectorAll('[data-tab]').forEach(tab=>{const active=tab.dataset.tab===type;tab.classList.toggle('selected',active);tab.setAttribute('aria-pressed',String(active))});document.querySelectorAll('.object-choice').forEach(c=>{const active=c.dataset.scene===type;c.classList.toggle('selected',active);c.setAttribute('aria-pressed',String(active))});document.querySelectorAll('.ritual').forEach(card=>card.classList.toggle('selected',card.dataset.type===type))}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>selectRitualTab(b.dataset.scene));
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>selectRitualTab(b.dataset.tab));document.querySelector('.ritual[data-type="chalice"]').classList.add('selected');
$('minusPlayers').onclick=()=>{state.count=Math.max(2,state.count-1);renderSetup()};$('plusPlayers').onclick=()=>{state.count=Math.min(8,state.count+1);renderSetup()};$('startButton').onclick=startGame;$('nextTurnButton').onclick=nextTurn;$('restartButton').onclick=resetGame;$('globalHelp').onclick=showRules;$('globalHistory').onclick=showHistory;
$('toggleSound').onclick=()=>{state.sound=!state.sound;$('toggleSound').setAttribute('aria-pressed',String(state.sound));$('toggleSound').setAttribute('aria-label',state.sound?'Silenciar sonidos':'Activar sonidos');$('toggleSound').textContent=state.sound?'♫':'♪';if(state.sound){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx??=new AC()}catch(e){}}};
document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>adjust(b.dataset.plus,1));document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>adjust(b.dataset.minus,-1));document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>showInfo(b.dataset.info));document.querySelectorAll('[data-ritual]').forEach(b=>b.onclick=()=>proposeRitual(b.dataset.ritual));$('modalOverlay').onclick=e=>{if(e.target===$('modalOverlay')&&!state.revealing)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!state.revealing)closeModal()});
renderSetup();
</script></body></html>
